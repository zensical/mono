name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      attestations:
        required: true
        type: boolean

permissions:
  attestations: write # Required for attestations
  id-token: write # Required for OIDC

jobs:
  build:
    name: Executable (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Linux, x64
            artifact: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Linux, arm64
            artifact: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows, x64
            artifact: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: Windows, arm64
            artifact: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macOS, x64
            artifact: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS, arm64
            artifact: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build artifact
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Create artifact archive (Unix)
        shell: bash
        if: ${{ contains(matrix.target, 'windows') == false }}
        run: |
          mkdir -p artifacts
          tar -czf artifacts/mono-${{ matrix.artifact }}.tar.gz -C \
            target/${{ matrix.target }}/release mono

      - name: Create artifact archive (Windows)
        shell: pwsh
        if: ${{ contains(matrix.target, 'windows') == true }}
        run: |
          mkdir -p artifacts
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/mono.exe `
            -DestinationPath artifacts/mono-${{ matrix.artifact }}.zip

      - name: Create artifact attestation
        if: inputs.attestations == true
        uses: actions/attest@v4
        with:
          show-summary: false
          subject-path: artifacts/*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mono-${{ matrix.artifact }}
          path: artifacts/*
