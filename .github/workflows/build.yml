name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      attestations:
        required: true
        type: boolean

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: >-
    ${{ github.workflow }}-${{
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.number || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        github.event.action != 'closed' }}

jobs:
  build:
    name: Executable (${{ matrix.name }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - name: Linux, x64
            artifact: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Linux, arm64
            artifact: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows, x64
            artifact: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: Windows, arm64
            artifact: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macOS, x64
            artifact: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS, arm64
            artifact: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Remove unused Rust toolchains
        run: |
          # rust-cache fingerprints every installed toolchain.
          active="$(rustup show active-toolchain)"
          active="${active%% *}"
          rustup toolchain list --quiet | while read -r toolchain; do
            if [ "$toolchain" != "$active" ]; then
              rustup toolchain uninstall "$toolchain"
            fi
          done

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          save-if: >-
            ${{ github.event_name == 'push' &&
                github.ref == 'refs/heads/master' }}

      - name: Run tests
        run: cargo test --locked --workspace --target "${{ matrix.target }}"

      - name: Build artifact
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Create artifact archive (Unix)
        if: ${{ contains(matrix.target, 'windows') == false }}
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/mono-${{ matrix.artifact }}.tar.gz" -C \
            "target/${{ matrix.target }}/release" mono

      - name: Create artifact archive (Windows)
        if: ${{ contains(matrix.target, 'windows') == true }}
        shell: pwsh
        run: |
          mkdir -p artifacts
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/mono.exe" `
            -DestinationPath "artifacts/mono-${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mono-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  attestations:
    name: Attestations
    if: inputs.attestations == true
    needs: build
    permissions:
      contents: read
      attestations: write
      id-token: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          show-summary: false
          subject-path: artifacts/*
