name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions: {}

jobs:
  build:
    name: Build
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      attestations: true

  tag:
    name: Create tag
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=${RELEASE_BRANCH#release/}
          git check-ref-format "refs/tags/$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git rev-parse "$VERSION^{commit}")" = \
              "$(git rev-parse HEAD^{commit})"
          else
            git tag -a -m "Release $VERSION" -- "$VERSION"
          fi
          git push origin "refs/tags/$VERSION"

  release:
    name: Create release
    needs: tag
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up mono
        uses: zensical/mono@2be38f5a76677c8e5c342f269b78aaccc8631b7c # v0

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mono version changelog -s $VERSION > notes.txt
          gh release create $VERSION \
            --title ${VERSION#v} \
            --notes-file notes.txt \
            --draft

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $VERSION artifacts/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit $VERSION --draft=false

  publish:
    name: Publish
    needs:
      - tag
      - release
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up mono
        uses: zensical/mono@2be38f5a76677c8e5c342f269b78aaccc8631b7c # v0

      # Replace the registry token after configuring crates.io trust.
      - name: Publish to crates.io
        run: | # zizmor: ignore[use-trusted-publishing]
          mono version changed $VERSION | while read -r package; do
            cargo publish --package $package --no-verify --locked
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  promote:
    name: Move major tag
    needs:
      - tag
      - publish
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Move major version tag
        run: |
          major="${VERSION%%.*}"
          ref="refs/tags/$major"
          current=$(git ls-remote --refs origin "$ref")
          current=${current%%$'\t'*}
          if [ -n "$current" ]; then
            git fetch --no-tags origin "$ref"
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "Major tag is not an ancestor of this release" >&2
              exit 1
            fi
          fi
          git tag -f -- "$major" HEAD
          git push --force-with-lease="$ref:$current" origin "$ref"
