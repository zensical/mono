name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions: {}
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: read
      attestations: write
      id-token: write
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      attestations: true

  tag:
    name: Create tag
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          version=${RELEASE_BRANCH#release/}
          git check-ref-format "refs/tags/$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            test "$(git rev-parse "$VERSION^{commit}")" = \
              "$(git rev-parse 'HEAD^{commit}')"
          else
            git tag -a -m "Release $VERSION" -- "$VERSION"
          fi
          git push origin "refs/tags/$VERSION"

  release:
    name: Create release
    needs: tag
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up mono
        uses: zensical/mono@c6ece01fa0d0b2f46300e5998b1f07a5b77be616

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          error="$RUNNER_TEMP/release-error.txt"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" \
            > /dev/null 2> "$error"; then
            echo "Release $VERSION already exists"
          elif grep -q 'HTTP 404' "$error"; then
            mono version changelog -s "$VERSION" > notes.txt
            gh release create "$VERSION" \
              --verify-tag \
              --title "${VERSION#v}" \
              --notes-file notes.txt \
              --draft
          else
            cat "$error" >&2
            exit 1
          fi

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          assets=$(gh release view "$VERSION" --json assets \
            --jq '.assets[].name')
          draft=$(gh release view "$VERSION" --json isDraft \
            --jq '.isDraft')
          mkdir -p "$RUNNER_TEMP/release-assets"
          for file in "${files[@]}"; do
            name=$(basename "$file")
            if grep -Fxq -- "$name" <<< "$assets"; then
              gh release download "$VERSION" --pattern "$name" \
                --dir "$RUNNER_TEMP/release-assets" --clobber
              if ! cmp -s "$file" "$RUNNER_TEMP/release-assets/$name"; then
                echo "Existing asset $name differs from the build" >&2
                exit 1
              fi
            elif [ "$draft" = true ]; then
              gh release upload "$VERSION" "$file"
            else
              echo "Published release is missing asset $name" >&2
              exit 1
            fi
          done

  publish:
    name: Publish
    needs:
      - tag
      - release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: crates
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up mono
        uses: zensical/mono@c6ece01fa0d0b2f46300e5998b1f07a5b77be616

      - name: Sign in to crates.io
        id: crates
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: |
          cargo metadata --no-deps --format-version 1 --locked > metadata.json
          mono version changed "$VERSION" | while read -r package; do
            [ -n "$package" ] || continue
            if cargo publish --package "$package" --no-verify --locked; then
              continue
            fi
            version=$(jq -er --arg name "$package" \
              '.packages[] | select(.name == $name) | .version' metadata.json)
            if cargo info "$package@$version" --registry crates-io \
              > /dev/null; then
              echo "$package $version is already published"
            else
              echo "Could not publish or verify $package $version" >&2
              exit 1
            fi
          done

  publish-release:
    name: Publish release
    needs:
      - tag
      - publish
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Publish release
        run: gh release edit "$VERSION" --draft=false

  promote:
    name: Move major tag
    needs:
      - tag
      - publish-release
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Move major version tag
        run: |
          major="${VERSION%%.*}"
          ref="refs/tags/$major"
          current=$(git ls-remote --refs origin "$ref")
          current=${current%%$'\t'*}
          if [ -n "$current" ]; then
            git fetch --no-tags origin "$ref"
            if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
              echo "Major tag is not an ancestor of this release" >&2
              exit 1
            fi
          fi
          git tag -f -- "$major" HEAD
          git push --force-with-lease="$ref:$current" origin "$ref"
