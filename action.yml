name: Set up mono
description: Download and unpack the mono binary for CI
runs:
  using: composite
  steps:
    - shell: bash
      # Only a new runner-controlled directory is added to PATH.
      run: | # zizmor: ignore[github-env]
        set -e
        ASSET="mono-linux-x64.tar.gz"
        VERSION=$(curl -s \
          https://api.github.com/repos/zensical/mono/releases/latest | \
          jq -r .tag_name)
        MONO_BIN_DIR=$(mktemp -d "$RUNNER_TEMP/mono.XXXXXX")
        BASE_URL=https://github.com/zensical/mono/releases/download
        curl -sSL "$BASE_URL/$VERSION/$ASSET" -o "$MONO_BIN_DIR/mono.tar.gz"
        tar -xzf "$MONO_BIN_DIR/mono.tar.gz" -C "$MONO_BIN_DIR"
        chmod +x "$MONO_BIN_DIR/mono"
        echo "$MONO_BIN_DIR" >> "$GITHUB_PATH"
