name: Security

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: >-
    ${{ github.workflow }}-${{
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.number || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        github.event.action != 'closed' }}

jobs:
  audit:
    name: Audit
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore cargo-audit
        id: audit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/cargo-audit/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}

      - name: Set up Rust
        if: steps.audit-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked \
            --root "$RUNNER_TEMP/cargo-audit"

      - name: Save cargo-audit
        if: >-
          ${{ steps.audit-cache.outputs.cache-hit != 'true' &&
              github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/cargo-audit/bin/cargo-audit
          key: ${{ steps.audit-cache.outputs.cache-primary-key }}

      - name: Audit dependencies
        run: '"$RUNNER_TEMP/cargo-audit/bin/cargo-audit" audit'
